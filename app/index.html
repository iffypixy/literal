<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111215" />
    <meta name="description" content="Instant notes, on all your devices." />
    <meta name="apple-mobile-web-app-title" content="Literal" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Literal</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Before the app's code, so the stand-in page below is drawn like the editor from the first frame. -->
    <link rel="stylesheet" href="/base.css" />
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <!-- The page, ready to type on before the app's code arrives; main.tsx hands what was typed to the real one. -->
    <textarea class="editor early" aria-label="Note" autocapitalize="sentences" autofocus></textarea>
  </body>
</html>
